<script>
const params=new URLSearchParams(location.search),device=params.get('device')||'',isPcm=device.startsWith('pcm/');deviceLabel.textContent=device||'no device selected';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),spectro=document.createElement('canvas'),sctx=spectro.getContext('2d');
const windows=[.1,.25,.5,1,2,5,10,30,60],aggregates=[0,4,10,20,50,100,250,500,1000];
let view='time',windowSeconds=2,renderFps=30,frequencyMode='expanded',lastDraw=0,lastSpectro=0,unit='',sourceRate=0,lastArrival=0,maxArrival=0,missingCount=0,lastSequence=null,pcmSampleSequence=0;

class ChunkRing{
  constructor(){this.chunks=[];this.sampleCount=0;this.latestTime=0}

  pushRegular(values,t0,sequenceStart,rate){const chunk={values,t0,sequenceStart,rate,times:null};this.chunks.push(chunk);this.sampleCount+=values.length;this.latestTime=t0+(values.length-1)*1e6/rate;const cutoff=this.latestTime-120e6;while(this.chunks.length&&this.end(this.chunks[0])<cutoff){this.sampleCount-=this.chunks[0].values.length;this.chunks.shift()}}
  end(c){return c.times?c.times[c.times.length-1]:c.t0+(c.values.length-1)*1e6/c.rate}
  visit(seconds,fn){const cutoff=this.latestTime-seconds*1e6;for(const c of this.chunks){if(this.end(c)<cutoff)continue;for(let i=0;i<c.values.length;i++){const t=c.times?c.times[i]:c.t0+i*1e6/c.rate;if(t>=cutoff)fn(c.values[i],t)}}}

  lastValues(wanted){const n=Math.min(wanted,this.sampleCount),out=new Float64Array(n);let at=n;for(let ci=this.chunks.length-1;ci>=0&&at>0;ci--){const a=this.chunks[ci].values,take=Math.min(at,a.length);at-=take;out.set(a.subarray(a.length-take),at)}return at?out.subarray(at):out}
}
const ring=new ChunkRing();

function resizePreserving(c,cx,w,h){if(c.width===w&&c.height===h)return;const copy=document.createElement('canvas');copy.width=c.width;copy.height=c.height;if(copy.width&&copy.height)copy.getContext('2d').drawImage(c,0,0);c.width=w;c.height=h;if(copy.width&&copy.height)cx.drawImage(copy,0,0,copy.width,copy.height,0,0,w,h)}
function resize(){const d=devicePixelRatio||1,w=innerWidth,h=Math.max(100,innerHeight-document.querySelector('header').offsetHeight-document.querySelector('footer').offsetHeight),pw=Math.floor(w*d),ph=Math.floor(h*d);if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph;canvas.style.width=w+'px';canvas.style.height=h+'px'}ctx.setTransform(d,0,0,d,0,0);resizePreserving(spectro,sctx,pw,ph)}
addEventListener('resize',resize);resize();
document.querySelectorAll('.view').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x===b))});

aggregate.oninput=()=>{const ms=aggregates[+aggregate.value];aggregateValue.textContent=ms?ms+' ms':'off';resetAggregation();if(lowRateNode)lowRateNode.port.postMessage({type:'config',aggregationMs:ms})};
function gainAmount(){return 2**Number(gainControl.value)}function formatGain(v){return v<1?v.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')+'×':v+'×'}
gainControl.oninput=()=>{gainValue.textContent=formatGain(gainAmount());if(gainNode)gainNode.gain.setTargetAtTime(audioOn?gainAmount():0,audioCtx.currentTime,.02)};
fftPower.oninput=()=>fftValue.textContent=2**Number(fftPower.value);frequencyScale.onclick=()=>{const m=['expanded','log','linear'];frequencyMode=m[(m.indexOf(frequencyMode)+1)%m.length];frequencyScale.textContent='frequency: '+frequencyMode};

const IMA_INDEX=[-1,-1,-1,-1,2,4,6,8],IMA_STEP=[7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,60,66,73,80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,408,449,494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,2066,2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,27086,29794,32767];

function noteArrival(){const now=performance.now();if(lastArrival)maxArrival=Math.max(maxArrival,now-lastArrival);lastArrival=now}
function ingestScalar(incoming,newUnit){if(!incoming.length)return;noteArrival();const values=new Float32Array(incoming.length),times=new Float64Array(incoming.length);for(let i=0;i<incoming.length;i++){const s=incoming[i],delta=lastSequence===null?1:((s[0]-lastSequence)>>>0);if(lastSequence!==null&&delta!==1)missingCount+=Math.max(0,delta-1);lastSequence=s[0];times[i]=s[1];values[i]=s[2]}unit=newUnit||unit;sourceRate=estimateRate(times)||sourceRate;ring.push(values,times,incoming[0][0],sourceRate);feedAudio(values,sourceRate)}

function estimateRate(times){return times.length>1&&times[times.length-1]>times[0]?(times.length-1)*1e6/(times[times.length-1]-times[0]):0}

const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`);ws.binaryType='arraybuffer';
ws.onopen=()=>{connection.textContent='connected';connection.className='';if(isPcm)ws.send(JSON.stringify({type:'pcm_subscribe',device}))};ws.onclose=()=>{connection.textContent='disconnected';connection.className='warning'};ws.onerror=()=>{connection.textContent='error';connection.className='warning'};

const workletCode=`
class LowRateSource extends AudioWorkletProcessor{constructor(){super();this.q=[];this.rate=100;this.phase=0;this.a=0;this.b=0;this.started=false;this.aggregationMs=0;this.window=[];this.sum=0;this.underruns=0;this.tick=0;this.port.onmessage=e=>{const d=e.data;if(d.type==='reset'){this.q=[];this.started=false;this.phase=0;this.window=[];this.sum=0;return}if(d.type==='config'){this.aggregationMs=d.aggregationMs||0;this.window=[];this.sum=0;return}if(d.rate>0)this.rate=d.rate;const n=Math.max(1,Math.round(this.rate*this.aggregationMs/1000));for(const raw of d.samples||[]){this.window.push(raw);this.sum+=raw;if(this.window.length>n)this.sum-=this.window.shift();this.q.push(this.sum/this.window.length)}}}process(i,o){const out=o[0][0];if(!this.started&&this.q.length>=Math.max(4,Math.ceil(this.rate*.25))){this.a=this.q.shift();this.b=this.q.shift();this.started=true}for(let x=0;x<out.length;x++){if(!this.started){out[x]=0;continue}out[x]=this.a+(this.b-this.a)*this.phase;this.phase+=this.rate/sampleRate;while(this.phase>=1){this.phase--;this.a=this.b;if(this.q.length)this.b=this.q.shift();else{this.b=0;this.started=false;this.underruns++;break}}}this.tick-=out.length;if(this.tick<=0){this.tick=sampleRate/5;this.port.postMessage({buffer:this.q.length/this.rate,underruns:this.underruns})}return true}}

registerProcessor('low-rate-source',LowRateSource);registerProcessor('signal-meter',SignalMeter);`;
let audioCtx=null,lowRateNode=null,reconstruction=null,baselineFilter=null,gainNode=null,meterNode=null,audioOn=false,nextStart=0,nativeUnderruns=0,aggregationState=[];
function resetAggregation(){aggregationState=[]}
async function createAudio(){audioCtx=new AudioContext();const url=URL.createObjectURL(new Blob([workletCode],{type:'application/javascript'}));await audioCtx.audioWorklet.addModule(url);URL.revokeObjectURL(url);lowRateNode=new AudioWorkletNode(audioCtx,'low-rate-source',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1]});reconstruction=audioCtx.createBiquadFilter();reconstruction.type='lowpass';baselineFilter=audioCtx.createBiquadFilter();baselineFilter.type='highpass';baselineFilter.frequency.value=.1;baselineFilter.Q.value=.707;gainNode=audioCtx.createGain();gainNode.gain.value=0;meterNode=new AudioWorkletNode(audioCtx,'signal-meter');lowRateNode.connect(reconstruction);reconstruction.connect(baselineFilter).connect(gainNode).connect(meterNode).connect(audioCtx.destination);lowRateNode.port.onmessage=e=>{audioBuffer.textContent=e.data.buffer.toFixed(2)+' s';underruns.textContent=e.data.underruns+nativeUnderruns};meterNode.port.onmessage=e=>{outputPeak.textContent=e.data.peak.toFixed(3);clipping.textContent=e.data.clips};lowRateNode.port.postMessage({type:'config',aggregationMs:aggregates[+aggregate.value]})}
function aggregateSamples(values,rate){const ms=aggregates[+aggregate.value],n=Math.max(1,Math.round(rate*ms/1000));if(n===1)return values;const out=new Float32Array(values.length);let sum=aggregationState.reduce((a,b)=>a+b,0);for(let i=0;i<values.length;i++){aggregationState.push(values[i]);sum+=values[i];if(aggregationState.length>n)sum-=aggregationState.shift();out[i]=sum/aggregationState.length}return out}
function feedAudio(values,rate){if(!audioOn||!audioCtx)return;if(rate<8000){reconstruction.frequency.setTargetAtTime(Math.min(audioCtx.sampleRate*.45,rate*.48),audioCtx.currentTime,.02);lowRateNode.port.postMessage({rate,samples:values})}else{reconstruction.frequency.setTargetAtTime(audioCtx.sampleRate*.45,audioCtx.currentTime,.02);const processed=aggregateSamples(values,rate),buffer=audioCtx.createBuffer(1,processed.length,rate);buffer.copyToChannel(processed,0);const now=audioCtx.currentTime,target=now+.5;if(nextStart<now+.01){if(nextStart)nativeUnderruns++;nextStart=target}const source=audioCtx.createBufferSource();source.buffer=buffer;source.connect(reconstruction);source.start(nextStart);nextStart+=buffer.duration;audioBuffer.textContent=Math.max(0,nextStart-now).toFixed(2)+' s';underruns.textContent=nativeUnderruns}}
audio.onclick=async()=>{if(!audioCtx)await createAudio();await audioCtx.resume();audioOn=!audioOn;resetAggregation();if(audioOn){nextStart=audioCtx.currentTime+.5;lowRateNode.port.postMessage({type:'reset'});lowRateNode.port.postMessage({type:'config',aggregationMs:aggregates[+aggregate.value]})}gainNode.gain.setTargetAtTime(audioOn?gainAmount():0,audioCtx.currentTime,.025);audio.classList.toggle('active',audioOn);audio.textContent=audioOn?'audio on':'start audio'};

function frame(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.fillStyle='#050608';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#26313a';for(let i=0;i<=4;i++){const y=h*i/4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}return{w,h,top:0,bottom:h,height:h}}
function labels(f,left,right,bottom){ctx.fillStyle='#71818d';ctx.font='11px monospace';ctx.textAlign='left';ctx.fillText(left,10,14);ctx.textAlign='right';ctx.fillText(right,f.w-10,14);ctx.textAlign='left';ctx.fillText(bottom,10,f.h-8)}
function drawSeries(seconds,centered){const f=frame(),start=ring.latestTime-seconds*1e6,bins=Math.max(1,Math.floor(f.w)),mins=new Float32Array(bins),maxs=new Float32Array(bins),aggregationMs=aggregates[+aggregate.value],aggregationSamples=Math.max(1,Math.round(sourceRate*aggregationMs/1000)),window=[],visitSeconds=seconds+aggregationMs/1000;mins.fill(Infinity);maxs.fill(-Infinity);let lo=Infinity,hi=-Infinity,sum=0,n=0,rolling=0;ring.visit(visitSeconds,(raw,t)=>{window.push(raw);rolling+=raw;if(window.length>aggregationSamples)rolling-=window.shift();if(t<start)return;const v=rolling/window.length;lo=Math.min(lo,v);hi=Math.max(hi,v);sum+=v;n++;const b=Math.min(bins-1,Math.max(0,Math.floor((t-start)/(seconds*1e6)*bins)));mins[b]=Math.min(mins[b],v);maxs[b]=Math.max(maxs[b],v)});if(!n)return;const mean=sum/n;if(centered){let peak=Math.max(Math.abs(lo-mean),Math.abs(hi-mean))||1;lo=-peak;hi=peak}else if(hi===lo){const p=Math.abs(lo)*.01||1;lo-=p;hi+=p}ctx.strokeStyle='#8df';ctx.beginPath();let previous=-2;for(let b=0;b<bins;b++){if(mins[b]===Infinity)continue;const x=(b+.5)/bins*f.w,a=centered?mins[b]-mean:mins[b],z=centered?maxs[b]-mean:maxs[b],y1=f.bottom-(a-lo)/(hi-lo)*f.height,y2=f.bottom-(z-lo)/(hi-lo)*f.height;if(b!==previous+1)ctx.moveTo(x,y1);else ctx.lineTo(x,y1);if(y2!==y1)ctx.lineTo(x,y2);previous=b}ctx.stroke();labels(f,centered?'centered amplitude':`max ${hi.toFixed(4)} ${unit}`,centered?'':`min ${lo.toFixed(4)} ${unit}`,`${seconds.toFixed(2)} s · ${n} samples`);shown.textContent=n+' · '+seconds+' s'}
function aggregatedValues(values,rate){const ms=aggregates[+aggregate.value],n=Math.max(1,Math.round(rate*ms/1000));if(n===1)return values;const out=new Float64Array(values.length);let sum=0;for(let i=0;i<values.length;i++){sum+=values[i];if(i>=n)sum-=values[i-n];out[i]=sum/Math.min(n,i+1)}return out}

function frequencyPosition(i,a,b){const x=(i-a)/(b-a);return frequencyMode==='expanded'?Math.sqrt(x):frequencyMode==='log'?Math.log(i/a)/Math.log(b/a):x}function frequencyIndex(x,a,b){return frequencyMode==='expanded'?a+x*x*(b-a):frequencyMode==='log'?a*Math.pow(b/a,x):a+x*(b-a)}function centroidOf(s){let w=0,t=0;for(let i=1;i<s.mag.length;i++){w+=i*s.mag[i];t+=s.mag[i]}return t?w/t:1}
function drawSpectrum(s){const f=frame();if(!s)return;const a=1,b=s.mag.length-1,peak=Math.max(...s.mag)||1,c=centroidOf(s);ctx.strokeStyle='#fc8';ctx.beginPath();for(let i=a;i<=b;i++){const x=frequencyPosition(i,a,b)*f.w,y=f.bottom-s.mag[i]/peak*f.height;i===a?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();if(centroidEnabled.checked){const x=frequencyPosition(c,a,b)*f.w;ctx.strokeStyle='#ffd84a';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,f.h);ctx.stroke()}centroidValue.textContent=centroidEnabled.checked?(c*s.rate/s.n).toFixed(2)+' Hz':'—';labels(f,`${(s.rate/2).toFixed(2)} Hz Nyquist`,'',`${(s.rate/s.n).toFixed(3)} Hz/bin · FFT ${s.n} · ${(s.n/s.rate).toFixed(2)} s`)}
function updateSpectrogram(s){if(!s||performance.now()-lastSpectro<1000/30)return;lastSpectro=performance.now();const d=devicePixelRatio||1,col=Math.max(1,Math.round(d)),H=spectro.height,W=spectro.width,a=1,b=s.mag.length-1,peak=Math.max(...s.mag)||1;sctx.drawImage(spectro,col,0,W-col,H,0,0,W-col,H);sctx.fillStyle='#050608';sctx.fillRect(W-col,0,col,H);for(let y=0;y<H;y++){const p=frequencyIndex(1-y/Math.max(1,H-1),a,b),lo=Math.floor(p),fraction=p-lo,v=(smooth.checked&&lo<b?s.mag[lo]*(1-fraction)+s.mag[lo+1]*fraction:s.mag[Math.round(p)])/peak*255;sctx.fillStyle=`hsl(${240-v*.8} 90% ${v*.28}%)`;sctx.fillRect(W-col,y,col,1)}if(centroidEnabled.checked){const y=(1-frequencyPosition(centroidOf(s),a,b))*H;sctx.fillStyle='#ffd84a';sctx.beginPath();sctx.arc(W-col-1,y,Math.max(2,d*1.5),0,Math.PI*2);sctx.fill()}}
function drawSpectrogram(s){updateSpectrogram(s);const f=frame();ctx.drawImage(spectro,0,0,spectro.width,spectro.height,0,0,f.w,f.h);if(s){const c=centroidOf(s);centroidValue.textContent=centroidEnabled.checked?(c*s.rate/s.n).toFixed(2)+' Hz':'—';labels(f,`${(s.rate/2).toFixed(2)} Hz`,'',`frequency ↑ · time → · ${frequencyMode}`)}}
function render(now){requestAnimationFrame(render);if(now-lastDraw<1000/renderFps)return;lastDraw=now;resize();if(view==='time'){centroidValue.textContent='—';drawSeries(10,false)}else if(view==='wave'){centroidValue.textContent='—';drawSeries(windowSeconds,true)}else{const s=fftData();view==='spectrum'?drawSpectrum(s):drawSpectrogram(s)}sourceStats.textContent=sourceRate?`${sourceRate.toFixed(1)} Hz · Nyquist ${(sourceRate/2).toFixed(1)} Hz`:'—';missing.textContent=missingCount;arrival.textContent=`${lastArrival?(performance.now()-lastArrival).toFixed(0):0}/${maxArrival.toFixed(0)} ms`}requestAnimationFrame(render);
</script></body></html>
