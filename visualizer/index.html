<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RF · visualizer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050608;color:#dce6ee;font:12px monospace;overflow:hidden}header{height:auto;min-height:52px;padding:12px 16px;border-bottom:1px solid #26313a;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0;color:#adf;font-size:15px;letter-spacing:.1em}.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}button,input{accent-color:#9cf}button{background:#17212a;color:#adf;border:1px solid #33424e;padding:5px 8px;font:11px monospace}.active{background:#adf;color:#071018}label{display:flex;align-items:center;gap:4px;color:#71818d}input[type=range]{width:92px}canvas{display:block;width:100vw}footer{min-height:48px;padding:9px 16px;border-top:1px solid #26313a;color:#71818d;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px;align-items:start}footer div{min-width:0;white-space:nowrap}footer span{color:#dce6ee}.warning{color:#ff846f}@media(max-width:900px){footer{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){footer{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>OSC SIGNAL · <span id="device"></span></h1><div class="controls">
  <button id="audio">start audio</button>
  <button class="view active" data-view="time">time series</button>
  <button class="view" data-view="wave">waveform</button>
  <button class="view" data-view="spectrum">spectrum</button>
  <button class="view" data-view="spectrogram">spectrogram</button>
  <button id="frequencyScale">frequency: expanded</button>
  <label>window <input id="window" type="range" min="0" max="8" step="1" value="4"><span id="window-value">2 s</span></label>
  <label>render <input id="fps" type="range" min="5" max="60" step="1" value="30"><span id="fps-value">30 fps</span></label>
  <label>gain <input id="gain" type="range" min="0" max="15" step="1" value="8"><span id="gain-value">256×</span></label>
  <label>FFT <input id="fftPower" type="range" min="7" max="13" step="1" value="11"><span id="fftValue">2048</span></label>
  <label><input id="interpolate" type="checkbox" checked> smooth</label>
  <label><input id="centroidEnabled" type="checkbox"> centroid</label>
</div></header>
<canvas id="canvas"></canvas>
<footer><div>WS <span id="status" class="warning">connecting</span></div><div>rate <span id="rateValue">—</span></div><div>shown <span id="shownValue">0</span></div><div>sequence gaps <span id="gapValue">0</span></div><div>arrival max <span id="arrivalValue">0 ms</span></div><div>audio buffer <span id="audioBufferValue">—</span></div><div>audio underruns <span id="audioUnderrunValue">0</span></div><div>centroid <span id="centroidValue">—</span></div></footer>
<script>
const deviceKey=new URLSearchParams(location.search).get('device')||'';
const deviceEl=document.getElementById('device'),fpsEl=document.getElementById('fps'),gainEl=document.getElementById('gain'),audioEl=document.getElementById('audio'),statusEl=document.getElementById('status'),fftPowerEl=document.getElementById('fftPower'),smoothEl=document.getElementById('interpolate'),centroidEl=document.getElementById('centroidEnabled');
deviceEl.textContent=deviceKey||'no device selected';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const spectro=document.createElement('canvas'),sctx=spectro.getContext('2d');
const windows=[.1,.25,.5,1,2,5,10,30,60];
let view='time',windowSec=windows[+windowEl().value],renderFps=30,lastDraw=0,lastSpectro=0,frequencyMode='expanded';
let samples=[],unit='',lastSequence=null,gapCount=0,arrivalLast=0,arrivalMaxGap=0;
let audioCtx=null,audioNode=null,audioGain=null,audioOn=false,audioUnderruns=0;

function windowEl(){return document.getElementById('window')}
function resizePreserving(source,context,w,h){if(source.width===w&&source.height===h)return;const copy=document.createElement('canvas');copy.width=source.width;copy.height=source.height;if(copy.width&&copy.height)copy.getContext('2d').drawImage(source,0,0);source.width=w;source.height=h;if(copy.width&&copy.height)context.drawImage(copy,0,0,copy.width,copy.height,0,0,w,h)}
function resize(){const d=devicePixelRatio||1,w=innerWidth,h=Math.max(100,innerHeight-document.querySelector('header').offsetHeight-document.querySelector('footer').offsetHeight),pixelW=Math.floor(w*d),pixelH=Math.floor(h*d);if(canvas.width!==pixelW||canvas.height!==pixelH){canvas.width=pixelW;canvas.height=pixelH;canvas.style.width=w+'px';canvas.style.height=h+'px'}ctx.setTransform(d,0,0,d,0,0);resizePreserving(spectro,sctx,Math.max(1,pixelW),Math.max(1,pixelH))}
addEventListener('resize',resize);resize();
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b))});
windowEl().oninput=e=>{windowSec=windows[+e.target.value];document.getElementById('window-value').textContent=windowSec+' s'};
fpsEl.oninput=e=>{renderFps=+e.target.value;document.getElementById('fps-value').textContent=renderFps+' fps'};
function gainAmount(){return 2**Number(gainEl.value)}
gainEl.oninput=()=>{document.getElementById('gain-value').textContent=gainAmount()+'×';if(audioGain&&audioOn)audioGain.gain.setTargetAtTime(gainAmount(),audioCtx.currentTime,.02)};
fftPowerEl.oninput=()=>document.getElementById('fftValue').textContent=2**Number(fftPowerEl.value);
frequencyScale.onclick=()=>{const modes=['expanded','log','linear'];frequencyMode=modes[(modes.indexOf(frequencyMode)+1)%modes.length];frequencyScale.textContent='frequency: '+frequencyMode};

const workletSource=`
class SensorStreamProcessor extends AudioWorkletProcessor {
  constructor(){super();this.queue=[];this.inputRate=100;this.phase=0;this.current=0;this.next=0;this.started=false;this.underruns=0;this.previousInput=null;this.previousHighpass=0;this.reportCountdown=0;this.port.onmessage=e=>{if(e.data.type==='reset'){this.queue.length=0;this.started=false;this.phase=0;this.previousInput=null;this.previousHighpass=0;return}if(e.data.rate>0)this.inputRate=e.data.rate;const a=Math.exp(-2*Math.PI*.1/this.inputRate);for(const value of e.data.samples||[]){if(this.previousInput===null)this.previousInput=value;const filtered=a*(this.previousHighpass+value-this.previousInput);this.previousInput=value;this.previousHighpass=filtered;this.queue.push(filtered)}}}
  process(inputs,outputs){const out=outputs[0][0];if(!this.started&&this.queue.length>=Math.max(4,Math.ceil(this.inputRate*.25))){this.current=this.queue.shift();this.next=this.queue.shift();this.started=true}for(let i=0;i<out.length;i++){if(!this.started){out[i]=0;continue}out[i]=this.current+(this.next-this.current)*this.phase;this.phase+=this.inputRate/sampleRate;while(this.phase>=1){this.phase-=1;this.current=this.next;if(this.queue.length)this.next=this.queue.shift();else{this.next=0;this.started=false;this.underruns++;break}}}this.reportCountdown-=out.length;if(this.reportCountdown<=0){this.reportCountdown=sampleRate/5;this.port.postMessage({bufferSeconds:this.queue.length/this.inputRate,underruns:this.underruns})}return true}
}
registerProcessor('sensor-stream-processor',SensorStreamProcessor);`;
async function createAudio(){audioCtx=new AudioContext();const url=URL.createObjectURL(new Blob([workletSource],{type:'application/javascript'}));await audioCtx.audioWorklet.addModule(url);URL.revokeObjectURL(url);audioNode=new AudioWorkletNode(audioCtx,'sensor-stream-processor',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1]});audioNode.port.onmessage=e=>{audioUnderruns=e.data.underruns;audioBufferValue.textContent=e.data.bufferSeconds.toFixed(2)+' s';audioUnderrunValue.textContent=audioUnderruns};audioGain=audioCtx.createGain();audioGain.gain.value=0;audioNode.connect(audioGain).connect(audioCtx.destination)}
audioEl.onclick=async()=>{if(!audioCtx)await createAudio();await audioCtx.resume();audioOn=!audioOn;if(audioOn)audioNode.port.postMessage({type:'reset'});audioGain.gain.setTargetAtTime(audioOn?gainAmount():0,audioCtx.currentTime,.025);audioEl.classList.toggle('active',audioOn);audioEl.textContent=audioOn?'audio on':'start audio'};

function append(incoming){if(!incoming.length)return;const now=performance.now();if(arrivalLast)arrivalMaxGap=Math.max(arrivalMaxGap,now-arrivalLast);arrivalLast=now;for(const s of incoming){if(lastSequence!==null&&((s[0]-lastSequence)>>>0)!==1)gapCount++;lastSequence=s[0];samples.push({seq:s[0],t:s[1],v:s[2]})}if(audioOn&&audioNode){let inputRate=0;if(incoming.length>1){const elapsed=incoming.at(-1)[1]-incoming[0][1];if(elapsed>0)inputRate=(incoming.length-1)*1e6/elapsed}if(!(inputRate>0)){const recent=samples.slice(-Math.min(samples.length,200));inputRate=rateOf(recent)}if(inputRate>0&&inputRate<5000)audioNode.port.postMessage({rate:inputRate,samples:incoming.map(s=>s[2])})}const newest=samples.at(-1).t;while(samples.length&&newest-samples[0].t>120e6)samples.shift();if(samples.length>200000)samples.splice(0,samples.length-200000)}
const ws=new WebSocket(`wss://${location.host}`);
ws.onopen=()=>{statusEl.textContent='connected';statusEl.className=''};ws.onclose=()=>{statusEl.textContent='disconnected';statusEl.className='warning'};ws.onerror=()=>{statusEl.textContent='error';statusEl.className='warning'};
ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='sample_batch'){for(const s of d.streams||[])if(s.device===deviceKey){unit=s.unit||unit;append(s.samples)}}else if((d.type==='osc'||d.type==='json')&&d.device===deviceKey&&Number.isFinite(d.value)){unit=d.unit||unit;append([[(lastSequence??0)+1,Date.now()*1000,d.value]])}};

function visible(seconds=windowSec){if(!samples.length)return[];const end=samples.at(-1).t,start=end-seconds*1e6;let lo=0,hi=samples.length;while(lo<hi){const m=(lo+hi)>>1;if(samples[m].t<start)lo=m+1;else hi=m}return samples.slice(lo)}
function rateOf(a){if(a.length<2)return 0;return(a.length-1)*1e6/(a.at(-1).t-a[0].t)}
function bounds(a){let lo=Infinity,hi=-Infinity;for(const s of a){lo=Math.min(lo,s.v);hi=Math.max(hi,s.v)}if(!isFinite(lo))return[0,1];if(hi===lo){const p=Math.abs(lo)*.01||1;lo-=p;hi+=p}return[lo,hi]}
function frame(){const w=canvas.clientWidth,h=canvas.clientHeight,top=0,bottom=h;ctx.fillStyle='#050608';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#26313a';ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=top+(bottom-top)*i/4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}return{w,h,top,bottom,height:bottom-top}}
function labels(f,left,right,sub){ctx.fillStyle='#668075';ctx.font='11px Courier New';ctx.textAlign='left';ctx.fillText(left,10,f.top+14);ctx.textAlign='right';ctx.fillText(right,f.w-10,f.top+14);ctx.textAlign='left';ctx.fillText(sub,10,f.bottom-8)}
function drawLine(a,normalized=false){const f=frame();if(a.length<2)return;let[lo,hi]=bounds(a),mean=0;if(normalized){mean=a.reduce((q,s)=>q+s.v,0)/a.length;let peak=0;for(const s of a)peak=Math.max(peak,Math.abs(s.v-mean));peak||=1;lo=-peak;hi=peak}const start=a[0].t,end=a.at(-1).t,rate=rateOf(a),gap=rate?3e6/rate:Infinity;ctx.strokeStyle='#8df';ctx.lineWidth=1.25;ctx.beginPath();let pen=false,prevT=null;for(const s of a){const x=(s.t-start)/(end-start)*f.w,val=normalized?s.v-mean:s.v,y=f.bottom-(val-lo)/(hi-lo)*f.height;if(!pen||prevT===null||s.t-prevT>gap)ctx.moveTo(x,y);else ctx.lineTo(x,y);pen=true;prevT=s.t}ctx.stroke();labels(f,normalized?'centered amplitude':`max ${hi.toFixed(4)} ${unit}`,normalized?'':`min ${lo.toFixed(4)} ${unit}`,`${((end-start)/1e6).toFixed(2)} s · ${a.length} samples`)}

function fftData(a){if(a.length<8)return null;const wanted=2**Number(fftPowerEl.value);let n=1;while(n*2<=Math.min(wanted,a.length))n*=2;const src=a.slice(-n),re=new Float64Array(n),im=new Float64Array(n);let mean=src.reduce((q,s)=>q+s.v,0)/n;for(let i=0;i<n;i++)re[i]=(src[i].v-mean)*(.5-.5*Math.cos(2*Math.PI*i/(n-1)));for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len;for(let i=0;i<n;i+=len)for(let j=0;j<len/2;j++){const c=Math.cos(ang*j),s=Math.sin(ang*j),u=re[i+j],v=im[i+j],x=re[i+j+len/2]*c-im[i+j+len/2]*s,y=re[i+j+len/2]*s+im[i+j+len/2]*c;re[i+j]=u+x;im[i+j]=v+y;re[i+j+len/2]=u-x;im[i+j+len/2]=v-y}}const rate=rateOf(src),mag=new Float64Array(n/2);for(let i=1;i<n/2;i++)mag[i]=Math.hypot(re[i],im[i]);return{mag,rate,n}}
function frequencyPosition(index,minimum,maximum){const normalized=(index-minimum)/(maximum-minimum);if(frequencyMode==='expanded')return Math.sqrt(normalized);if(frequencyMode==='log')return Math.log(index/minimum)/Math.log(maximum/minimum);return normalized}
function frequencyIndex(normalized,minimum,maximum){if(frequencyMode==='expanded')return minimum+normalized*normalized*(maximum-minimum);if(frequencyMode==='log')return minimum*Math.pow(maximum/minimum,normalized);return minimum+normalized*(maximum-minimum)}
function spectralCentroid(spec){let weighted=0,total=0;for(let i=1;i<spec.mag.length;i++){weighted+=i*spec.mag[i];total+=spec.mag[i]}return total?weighted/total:1}
function drawSpectrum(spec){const f=frame();if(!spec)return;const minimum=1,maximum=spec.mag.length-1,peak=Math.max(...spec.mag)||1,centroid=spectralCentroid(spec);ctx.strokeStyle='#fc8';ctx.beginPath();for(let i=minimum;i<=maximum;i++){const x=frequencyPosition(i,minimum,maximum)*f.w,y=f.bottom-spec.mag[i]/peak*f.height;i===minimum?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();if(centroidEl.checked){const x=frequencyPosition(centroid,minimum,maximum)*f.w;ctx.strokeStyle='#ffd84a';ctx.beginPath();ctx.moveTo(x,f.top);ctx.lineTo(x,f.bottom);ctx.stroke()}centroidValue.textContent=centroidEl.checked?(centroid*spec.rate/spec.n).toFixed(2)+' Hz':'—';labels(f,`${(spec.rate/2).toFixed(2)} Hz Nyquist`,'',`${(spec.rate/spec.n).toFixed(3)} Hz/bin · FFT ${spec.n} · ${frequencyMode}`)}
function updateSpectrogram(spec){if(!spec||performance.now()-lastSpectro<80)return;lastSpectro=performance.now();const d=devicePixelRatio||1,col=Math.max(1,Math.round(d)),H=spectro.height,W=spectro.width,minimum=1,maximum=spec.mag.length-1,peak=Math.max(...spec.mag)||1;sctx.drawImage(spectro,col,0,W-col,H,0,0,W-col,H);sctx.fillStyle='#050608';sctx.fillRect(W-col,0,col,H);for(let y=0;y<H;y++){const position=frequencyIndex(1-y/Math.max(1,H-1),minimum,maximum),lower=Math.floor(position),fraction=position-lower,value=(smoothEl.checked&&lower<maximum?spec.mag[lower]*(1-fraction)+spec.mag[lower+1]*fraction:spec.mag[Math.round(position)])/peak*255;sctx.fillStyle=`hsl(${240-value*.8} 90% ${value*.28}%)`;sctx.fillRect(W-col,y,col,1)}if(centroidEl.checked){const centroid=spectralCentroid(spec),y=(1-frequencyPosition(centroid,minimum,maximum))*H;sctx.fillStyle='#ffd84a';sctx.beginPath();sctx.arc(W-col-1,y,Math.max(2,d*1.5),0,Math.PI*2);sctx.fill()}}
function drawSpectrogram(spec){updateSpectrogram(spec);const f=frame();ctx.drawImage(spectro,0,0,spectro.width,spectro.height,0,f.top,f.w,f.height);if(spec){const centroid=spectralCentroid(spec);centroidValue.textContent=centroidEl.checked?(centroid*spec.rate/spec.n).toFixed(2)+' Hz':'—';labels(f,`${(spec.rate/2).toFixed(2)} Hz`,'',`frequency ↑ · time → · ${frequencyMode}`)}}
function render(now){requestAnimationFrame(render);if(now-lastDraw<1000/renderFps)return;lastDraw=now;resize();const a=visible(view==='time'?10:windowSec),fftSamples=visible(120),spec=(view==='spectrum'||view==='spectrogram')?fftData(fftSamples):null;if(view==='time'){centroidValue.textContent='—';drawLine(a,false)}else if(view==='wave'){centroidValue.textContent='—';drawLine(a,true)}else if(view==='spectrum')drawSpectrum(spec);else drawSpectrogram(spec);const rate=rateOf(a);rateValue.textContent=rate.toFixed(1)+' samples/s';shownValue.textContent=a.length+' · '+(view==='time'?'10 s':windowSec+' s');gapValue.textContent=gapCount;arrivalValue.textContent=arrivalMaxGap.toFixed(0)+' ms'}
requestAnimationFrame(render);
</script>
</body>
</html>
