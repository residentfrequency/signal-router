<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RF · PCM stream</title><style>
*{box-sizing:border-box}body{margin:0;background:#050608;color:#dce6ee;font:12px monospace}header{padding:12px 16px;border-bottom:1px solid #26313a;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0;color:#adf;font-size:15px;letter-spacing:.1em}.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}button,input{accent-color:#9cf}button{background:#17212a;color:#adf;border:1px solid #33424e;padding:5px 8px;font:11px monospace}.active{background:#adf;color:#071018}canvas{display:block;width:100vw;height:calc(100vh - 104px)}footer{height:48px;padding:9px 16px;border-top:1px solid #26313a;color:#71818d;display:flex;gap:20px;flex-wrap:wrap}footer span{color:#dce6ee}</style></head>
<body><header><h1>REMOTE PCM · <span id="deviceLabel"></span></h1><div class="controls"><button id="start">start audio</button><button class="view active" data-view="wave">waveform</button><button class="view" data-view="spectrum">spectrum</button><button class="view" data-view="spectrogram">spectrogram</button><label>latency <input id="latency" type="range" min="50" max="1000" step="25" value="200"><span id="latencyValue">200ms</span></label></div></header><canvas id="canvas"></canvas><footer><div>WS <span id="connection">connecting</span></div><div>packets <span id="packets">0</span></div><div>missing <span id="missing">0</span></div><div>arrival max <span id="arrival">0ms</span></div><div>buffer <span id="buffer">0ms</span></div><div>rate <span id="rate">—</span></div></footer>
<script>
const params=new URLSearchParams(location.search),device=params.get('device')||'pcm/192.168.0.44/audio';deviceLabel.textContent=device;
let audioCtx=null,analyser=null,gain=null,nextStart=0,packetCount=0,missingCount=0,lastSequence=null,lastArrival=0,maxArrival=0,sampleRate=16000,view='wave';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),latency=document.getElementById('latency');
latency.oninput=()=>latencyValue.textContent=latency.value+'ms';
document.querySelectorAll('.view').forEach(button=>button.onclick=()=>{view=button.dataset.view;document.querySelectorAll('.view').forEach(b=>b.classList.toggle('active',b===button));if(view==='spectrogram')ctx.clearRect(0,0,canvas.width,canvas.height)});
start.onclick=async()=>{if(!audioCtx){audioCtx=new AudioContext();analyser=audioCtx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.65;gain=audioCtx.createGain();gain.gain.value=1;analyser.connect(gain).connect(audioCtx.destination)}await audioCtx.resume();nextStart=audioCtx.currentTime+Number(latency.value)/1000;start.textContent='audio on';start.classList.add('active')};
function schedule(samples,rate){if(!audioCtx||audioCtx.state!=='running')return;const audioBuffer=audioCtx.createBuffer(1,samples.length,rate),channel=audioBuffer.getChannelData(0);for(let i=0;i<samples.length;i++)channel[i]=samples[i]/32768;const now=audioCtx.currentTime,target=now+Number(latency.value)/1000;if(nextStart<now+.01||nextStart>now+2)nextStart=target;const source=audioCtx.createBufferSource();source.buffer=audioBuffer;source.connect(analyser);source.start(nextStart);nextStart+=audioBuffer.duration}
const ws=new WebSocket(`wss://${location.host}`);ws.binaryType='arraybuffer';
ws.onopen=()=>{connection.textContent='connected';ws.send(JSON.stringify({type:'pcm_subscribe',device}))};ws.onclose=()=>connection.textContent='disconnected';
ws.onmessage=event=>{if(typeof event.data==='string'){try{const message=JSON.parse(event.data);if(message.type==='pcm_stream'&&message.device===device)rate.textContent=(message.sampleRate||'—')+' Hz'}catch{}return}const data=new DataView(event.data);if(data.byteLength<32||String.fromCharCode(data.getUint8(0),data.getUint8(1),data.getUint8(2),data.getUint8(3))!=='ESAU')return;const sequence=data.getUint32(8,true),rateHz=data.getUint32(20,true),count=data.getUint16(24,true),header=data.getUint16(26,true);if(header+count*2!==data.byteLength)return;const now=performance.now();if(lastArrival)maxArrival=Math.max(maxArrival,now-lastArrival);lastArrival=now;if(lastSequence!==null&&sequence>lastSequence+1)missingCount+=sequence-lastSequence-1;lastSequence=sequence;packetCount++;sampleRate=rateHz;const samples=new Int16Array(count);for(let i=0;i<count;i++)samples[i]=data.getInt16(header+i*2,true);schedule(samples,rateHz);packets.textContent=packetCount;missing.textContent=missingCount;arrival.textContent=maxArrival.toFixed(0)+'ms';rate.textContent=rateHz+' Hz'};
function resize(){const d=devicePixelRatio||1,w=Math.floor(innerWidth*d),h=Math.floor((innerHeight-104)*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}};
function render(){resize();const w=canvas.width,h=canvas.height;if(!analyser){ctx.fillStyle='#050608';ctx.fillRect(0,0,w,h);requestAnimationFrame(render);return}if(view==='wave'){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);ctx.fillStyle='#050608';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#8df';ctx.beginPath();for(let i=0;i<a.length;i++){const x=i/(a.length-1)*w,y=h/2-a[i]*h*.45;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}else{const a=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(a);if(view==='spectrum'){ctx.fillStyle='#050608';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#fc8';ctx.beginPath();for(let i=1;i<a.length;i++){const x=Math.log(i)/Math.log(a.length-1)*w,y=h-a[i]/255*h;i===1?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}else{ctx.drawImage(canvas,-1,0);for(let y=0;y<h;y++){const normalized=1-y/h,index=Math.min(a.length-1,Math.floor(normalized*normalized*a.length));const value=a[index];ctx.fillStyle=`hsl(${240-value*.8} 90% ${value*.28}%)`;ctx.fillRect(w-1,y,1,1)}}}buffer.textContent=audioCtx?Math.max(0,(nextStart-audioCtx.currentTime)*1000).toFixed(0)+'ms':'0ms';requestAnimationFrame(render)}render();
</script></body></html>
